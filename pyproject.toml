[project]
name = "mailsync"
version = "0.1.0"
description = "Unified local MCP server for Apple Mail accounts"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0"]

[project.scripts]
mailsync = "mailsync.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mailsync"]

[tool.setuptools.package-data]
mailsync = ["applescript/*.applescript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
